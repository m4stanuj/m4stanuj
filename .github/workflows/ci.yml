name: Profile Health Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  profile-readme:
    name: Validate profile README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify profile files and assets
        shell: python
        run: |
          from pathlib import Path

          required = [
              "README.md",
              "ARCHITECTURE.md",
              "mast_banner.gif",
              "aegis_banner.gif",
              "openwork_banner.gif",
              "sniper_banner.gif",
          ]
          missing = [name for name in required if not Path(name).exists()]
          if missing:
              raise SystemExit(f"Missing required profile assets: {missing}")

          for name in ["README.md", "ARCHITECTURE.md"]:
              text = Path(name).read_text(encoding="utf-8")
              if text.count("```") % 2:
                  raise SystemExit(f"Unbalanced markdown fences in {name}")
              forbidden = [
                  "<<<<<<<",
                  "=======",
                  ">>>>>>>",
                  "architect_profile.json",
                  "/var/log/mast/system.log",
                  "<![CDATA[",
                  "]]>",
              ]
              found = [item for item in forbidden if item in text]
              if found:
                  raise SystemExit(f"Forbidden content in {name}: {found}")

          readme = Path("README.md").read_text(encoding="utf-8")
          for asset in ["mast_banner.gif", "aegis_banner.gif", "openwork_banner.gif", "sniper_banner.gif"]:
              if f"./{asset}" not in readme:
                  raise SystemExit(f"README must reference ./{asset}")

          for repo in ["MAST", "cai-osint", "openwork", "LeadSniper"]:
              if f"https://github.com/m4stanuj/{repo}" not in readme:
                  raise SystemExit(f"Missing project link: {repo}")

      - name: Secret scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --no-git --redact --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
